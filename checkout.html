<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — ELECTRONIC WORLD</title>
  <meta name="description" content="Complete your purchase securely at Electronic World.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-root"></div>
  <div class="page-header">
    <div class="container">
      <h1>💳 Checkout</h1>
      <div class="breadcrumb"><a href="/">Home</a> <span>›</span> <a href="/cart.html">Cart</a> <span>›</span> <span>Checkout</span></div>
    </div>
  </div>
  <div class="container">
    <div class="checkout-layout" id="checkout-layout">
      <div id="checkout-form-area">
        <div class="checkout-step">
          <h3><span class="step-number">1</span> Shipping Information</h3>
          <form id="shipping-form" class="form-grid">
            <div class="form-group"><label>Full Name</label><input type="text" id="sh-name" required placeholder="Your full name"></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="sh-phone" required placeholder="+91 98765 43210"></div>
            <div class="form-group full"><label>Address</label><input type="text" id="sh-address" required placeholder="Street address"></div>
            <div class="form-group"><label>City</label><input type="text" id="sh-city" required placeholder="City"></div>
            <div class="form-group"><label>State</label><input type="text" id="sh-state" required placeholder="State"></div>
            <div class="form-group"><label>PIN Code</label><input type="text" id="sh-zip" required placeholder="751024"></div>
            <div class="form-group"><label>Email</label><input type="email" id="sh-email" required placeholder="you@email.com"></div>
          </form>
        </div>
        <div class="checkout-step">
          <h3><span class="step-number">2</span> Payment Method</h3>
          <div class="payment-methods" id="payment-methods">
            <div class="payment-method active" onclick="selectPayment(this, 'Card')"><div class="pm-icon">💳</div><div class="pm-label">Card</div></div>
            <div class="payment-method" onclick="selectPayment(this, 'UPI')"><div class="pm-icon">📱</div><div class="pm-label">UPI</div></div>
            <div class="payment-method" onclick="selectPayment(this, 'COD')"><div class="pm-icon">🏦</div><div class="pm-label">Cash on Delivery</div></div>
          </div>
          <div id="card-fields" class="form-grid" style="margin-top:20px">
            <div class="form-group full"><label>Card Number</label><input type="text" placeholder="1234 5678 9012 3456" maxlength="19"></div>
            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YY" maxlength="5"></div>
            <div class="form-group"><label>CVV</label><input type="password" placeholder="•••" maxlength="3"></div>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%" onclick="placeOrder()">🔒 Place Order</button>
      </div>
      <div id="checkout-summary"></div>
    </div>
    <div id="order-result" style="display:none"></div>
  </div>
  <div id="footer-root"></div>
  <script src="/js/app.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
