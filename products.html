<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — ELECTRONIC WORLD</title>
  <meta name="description"
    content="Browse our full collection of smartphones, laptops, audio, air conditioning and more at best prices.">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div id="navbar-root"></div>

  <div class="page-header" id="products-page-header">
    <div class="container">
      <h1 id="page-title">All Products</h1>
      <div class="breadcrumb">
        <a href="/">Home</a> <span>›</span> <span id="breadcrumb-current">Products</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="listing-layout">
      <aside class="sidebar">
        <button class="sidebar-close" id="sidebar-close" aria-label="Close filters">×</button>
        <div class="filter-group">
          <h3>Categories</h3>
          <div id="category-filters"></div>
        </div>
        <div class="filter-group">
          <h3>Price Range</h3>
          <div class="filter-option"><input type="radio" name="price" value="" checked> All Prices</div>
          <div class="filter-option"><input type="radio" name="price" value="0-10000"> Under ₹10,000</div>
          <div class="filter-option"><input type="radio" name="price" value="10000-25000"> ₹10,000 - ₹25,000</div>
          <div class="filter-option"><input type="radio" name="price" value="25000-50000"> ₹25,000 - ₹50,000</div>
          <div class="filter-option"><input type="radio" name="price" value="50000-100000"> ₹50,000 - ₹1,00,000</div>
          <div class="filter-option"><input type="radio" name="price" value="100000-999999"> Above ₹1,00,000</div>
        </div>
        <div class="filter-group">
          <h3>Rating</h3>
          <div class="filter-option"><input type="radio" name="rating" value="" checked> All Ratings</div>
          <div class="filter-option"><input type="radio" name="rating" value="4.5"> ★★★★½ & up</div>
          <div class="filter-option"><input type="radio" name="rating" value="4"> ★★★★ & up</div>
          <div class="filter-option"><input type="radio" name="rating" value="3"> ★★★ & up</div>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <main>
        <div class="listing-toolbar">
          <button class="filter-toggle-btn" id="filter-toggle-btn">🔍 Filters</button>
          <span class="result-count" id="result-count">Loading...</span>
          <div style="display:flex;align-items:center;gap:12px;">
            <select id="sort-select">
              <option value="">Sort by: Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="newest">Newest First</option>
            </select>
            <div class="view-toggle">
              <button class="active" id="grid-view-btn" title="Grid">⊞</button>
              <button id="list-view-btn" title="List">☰</button>
            </div>
          </div>
        </div>
        <div class="products-grid" id="products-grid"></div>
        <div class="empty-state" id="empty-state" style="display:none">
          <div class="empty-icon">🔍</div>
          <h3>No products found</h3>
          <p>Try adjusting your filters or search terms</p>
          <a href="/products.html" class="btn btn-primary btn-sm">Clear Filters</a>
        </div>
      </main>
    </div>
  </div>

  <div id="footer-root"></div>
  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>

</html>
